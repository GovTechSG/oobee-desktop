name: Build MacOS and Windows image

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Pre-release app (grey icon)'
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  # Build llama.cpp with Vulkan (via MoltenVK) enabled for darwin-x64.
  # ggml-org's official darwin-x64 release ships CPU-only libs, and the Metal
  # backend is broken on AMD Radeon GPUs on macOS (ggml-org/llama.cpp#19563
  # — KV-cache corruption + simd_max(half) mis-compute on RDNA). Vulkan via
  # MoltenVK is the working alternative demonstrated on that hardware.
  # Runs first so the mac job can restore the resulting binary from cache;
  # on failure this job is best-effort — continue-on-error lets the mac job
  # proceed and fall back to the ggml-org CPU-only binary via
  # fetch-llama-binaries.js.
  build-llama-vulkan-x64:
    # macos-15-intel is the standard-tier x86_64 runner (macos-13 was
    # retired 2025 and never picks up jobs; macos-14+ default labels
    # resolve to arm64). Building natively on Intel matches the target CPU
    # exactly and lets Homebrew provide the x86_64 vulkan-loader bottle
    # directly — cross-compiling from arm64 would require building
    # Vulkan-Loader from source.
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Read pinned llama.cpp tag
        id: pin
        run: |
          TAG=$(node -e "console.log(require('./resources/llama-binaries.json').tag)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Cache key includes the sha of the build script so any local change
      # to the build recipe invalidates the cache. -vulkan-v1 namespace bump
      # from the prior -metal-v4 forces one fresh build after the backend
      # swap; subsequent CI runs restore from cache normally.
      - name: Cache llama.cpp Vulkan build (darwin-x64)
        id: cache
        uses: actions/cache@v4
        with:
          path: resources/darwin-x64/llama-server
          key: llama-server-darwin-x64-${{ steps.pin.outputs.tag }}-vulkan-v1-${{ hashFiles('scripts/build-llama-vulkan-x64.sh') }}

      - name: Build llama.cpp with Vulkan for darwin-x64
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-vulkan-x64.sh "${{ steps.pin.outputs.tag }}"

  # Download the Xenova/all-MiniLM-L6-v2 model files from Hugging Face once,
  # cache them, and let build-wcag-index + build-frameworks-index (and both
  # platform jobs, as fallback) restore them. The model is ~90 MB; skipping
  # the redownload on every build shaves 20-30s and avoids HF rate limits.
  # Runs on ubuntu-latest — the model bytes are platform-agnostic.
  build-embedding-model:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache embedding model
        id: cache
        uses: actions/cache@v4
        with:
          path: public/electron/embedding-model
          # Bust the cache when the downloader script changes. Bump the -vN
          # suffix manually to force a redownload (e.g. after swapping to
          # a different embedding model).
          key: embedding-model-${{ hashFiles('scripts/ensure-embedding-model.js', 'scripts/build-embedding-model.js') }}-v1

      - name: Download embedding model
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/ensure-embedding-model.js

      - name: Show model size
        run: |
          if [ -d public/electron/embedding-model ]; then
            du -sh public/electron/embedding-model 2>/dev/null || true
          fi

      - name: Upload embedding model as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-model
          path: public/electron/embedding-model
          retention-days: 1

  # Build the WCAG + DSS + oobee DETAILS.md search index (hybrid BM25 +
  # vector). Now includes .vec files (MiniLM embeddings) alongside the
  # .pb/.txt pair — embedding ~2,900 chunks takes ~2 minutes on CI plus the
  # scrape. Depends on build-embedding-model to reuse the same downloaded
  # model files rather than fetching from Hugging Face twice.
  build-wcag-index:
    needs: build-embedding-model
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache WCAG source, DSS scrape, and built index
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/wcag-src
            .cache/oobee-DETAILS.md
            .cache/dss
            public/electron/wcag-index
          # Bust the cache when any of the scrape/build scripts change or the
          # corpus module's chunk-write layout changes (bumping .vec means
          # BM25-only caches are stale). The WCAG tag is pinned inside
          # ensure-wcag-index.js so its hash covers tag bumps too. DETAILS.md
          # is fetched from oobee master and is not pinned — bump the -vN
          # suffix manually to force a rebuild when upstream DETAILS.md
          # changes materially.
          key: wcag-index-${{ hashFiles('scripts/ensure-wcag-index.js', 'scripts/build-wcag-index.js', 'scripts/build-dss-corpus.js') }}-v3

      # Pull the embedding-model artifact from the upstream job so
      # build-wcag-index.js can embed the chunks. Cache-hit path skips this —
      # the WCAG index cache already contains the embedded output.
      - name: Download embedding-model artifact
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: embedding-model
          path: public/electron/embedding-model

      - name: Install dependencies (only needed to build the index)
        if: steps.cache.outputs.cache-hit != 'true'
        # `npm install` (not `npm ci`) to match the platform jobs — the repo's
        # package-lock.json drifts from package.json occasionally, and `npm ci`
        # would fail-hard on that. --ignore-scripts skips the react-scripts
        # postinstall which we don't need for the scrape/embed step.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Scrape WCAG + DSS and build hybrid index (BM25 + vector)
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/ensure-wcag-index.js

      - name: Show index size
        run: |
          if [ -d public/electron/wcag-index ]; then
            du -sh public/electron/wcag-index .cache 2>/dev/null || true
          fi

      # actions/cache is OS-scoped in practice (Linux + macOS use zstd, the
      # Windows runner falls back to gzip → different physical entry under the
      # same key), so windows-install-purple never hits this job's cache.
      # Re-publish the same paths as a workflow-run artifact so both platform
      # jobs can pick them up via download-artifact, which IS cross-OS.
      # include-hidden-files: true is required because the top-level path
      # begins with `.cache/`.
      - name: Upload WCAG + DSS index as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-dss-index
          path: |
            .cache/wcag-src
            .cache/oobee-DETAILS.md
            .cache/dss
            public/electron/wcag-index
          include-hidden-files: true
          retention-days: 1

  # Same pattern as build-wcag-index, but for the framework/language docs
  # corpus consumed by the `search_language_and_frameworks` LLM tool. Clones
  # oobee-ai-rag-index at a pinned `synced/*` tag, chunks the markdown, and
  # embeds each chunk (hybrid BM25 + vector). Runs on ubuntu-latest — the
  # output is platform-agnostic bytes, so both windows/mac platform jobs
  # restore it via download-artifact.
  build-frameworks-index:
    needs: build-embedding-model
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache oobee-ai-rag-index checkout and built frameworks index
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/frameworks-src
            public/electron/frameworks-index
          # Bust the cache when either the ensure script (which pins the tag)
          # or the build script changes, or when the chunk-write layout
          # changes (bumping -v1 → -v2 forces a rebuild for the new .vec
          # files). Bump the -vN suffix manually to force a rebuild without
          # touching either script.
          key: frameworks-index-${{ hashFiles('scripts/ensure-frameworks-index.js', 'scripts/build-frameworks-index.js') }}-v2

      - name: Download embedding-model artifact
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: embedding-model
          path: public/electron/embedding-model

      - name: Install dependencies (only needed to build the index)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Clone oobee-ai-rag-index and build hybrid frameworks/languages index
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/ensure-frameworks-index.js

      - name: Show index size
        run: |
          if [ -d public/electron/frameworks-index ]; then
            du -sh public/electron/frameworks-index .cache/frameworks-src 2>/dev/null || true
          fi

      # actions/cache is OS-scoped in practice, so windows-install-purple never
      # hits this job's cache directly. Re-publish the same paths as a
      # workflow-run artifact — download-artifact is cross-OS.
      - name: Upload frameworks/languages index as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frameworks-docs-index
          path: |
            .cache/frameworks-src
            public/electron/frameworks-index
          include-hidden-files: true
          retention-days: 1

  windows-install-purple:
    needs: [build-embedding-model, build-wcag-index, build-frameworks-index]
    # Fall back to scraping/embedding locally if the shared build failed.
    if: always()
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      # Pull the WCAG + DSS index from the workflow-scoped artifact that
      # build-wcag-index uploaded. actions/cache is OS-scoped on windows, so
      # download-artifact is the cross-OS replacement. On failure (upstream
      # job failed or artifact missing) continue anyway — ensure-wcag-index.js
      # will rebuild locally during npm run make-win.
      - name: Download WCAG + DSS index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wcag-dss-index
          path: .

      # Same story for the framework/language docs index — restore from the
      # build-frameworks-index artifact so make-win doesn't re-clone
      # oobee-ai-rag-index + re-chunk locally. Fallback: ensure-frameworks-
      # index.js re-runs during make-win.
      - name: Download frameworks/languages docs index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frameworks-docs-index
          path: .

      # Restore the bundled MiniLM embedding model. Needed at runtime for
      # the hybrid search vector leg AND at build time as a fallback when
      # the WCAG/frameworks index artifacts miss (ensure-embedding-model.js
      # would otherwise fetch it from Hugging Face during make-win).
      - name: Download embedding-model artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: embedding-model
          path: public/electron/embedding-model

      - name: Enable Long File Path in Registry
        shell: pwsh
        run: |
          Start-Process powershell -Verb runAs -ArgumentList 'New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -PropertyType "DWORD" -Value "1"'
      
      - name: Download node.js version from nodejs.org
        run: |
          curl -o ./nodejs-win.zip --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-win-x64.zip
          mkdir nodejs-win && tar -xzf nodejs-win.zip -C nodejs-win --strip-components=1 && rm ./nodejs-win.zip
        working-directory: ${{github.workspace}}

      - name: Download and Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile "${{github.workspace}}\is.exe" 
          Start-Process -FilePath "${{github.workspace}}\is.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
          echo "${env:programfiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Install Node Modules and Build for Windows
        run: |
          $env:Path = "${{github.workspace}}\nodejs-win;${{github.workspace}}\oobee-desktop\node_modules\.bin;$env:Path;";
          npm install
          npm run make-win
        env:
          CI: "false"
          PRE_RELEASE: ${{ inputs.pre_release && '1' || '' }}
        working-directory: ${{github.workspace}}

      - name: Move build to root
        shell: pwsh
        run: |
          Move-Item  "${{github.workspace}}\out\Oobee-win32-x64" -Destination "${{github.workspace}}\Oobee-win32-x64" -Force
      
      - name: Download Oobee Backend
        shell: pwsh
        run: |
          $PHbackendUrl = "https://github.com/GovTechSG/oobee/releases/download/${{ vars.BE_TAG }}/oobee-portable-windows.zip"
          $BEdestinationPath = "${{github.workspace}}\PHLatest.zip"
          $BEextractPath = "D:\a\Oobee Backend"
          Invoke-WebRequest -Uri $PHbackendUrl -OutFile $BEdestinationPath
          Expand-Archive -Path $BEdestinationPath -DestinationPath $BEextractPath -Force
          Remove-Item -Path $BEdestinationPath

      - name: Execute Inno Setup script to compile installer
        shell: pwsh
        run: ISCC /O"${{github.workspace}}" "${{github.workspace}}\a11y_for_windows.iss"

      - name: Move compiled installer to Workspace
        run: |
          New-Item -Path setup -ItemType Directory
          Move-Item -Path mysetup.exe -Destination setup\Oobee-setup.exe
        working-directory: ${{github.workspace}}

      - name: Zip Setup file (Windows)
        shell: pwsh
        run: Compress-Archive -Path ${{github.workspace}}/setup/* -DestinationPath oobee-desktop-windows.zip
        working-directory: ${{github.workspace}}
        
      - name: Compute SHA256 hash for Windows
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 oobee-desktop-windows.zip).Hash
          [System.IO.File]::WriteAllText("oobee-desktop-windows.zip.sha256.txt", $hash)
      
      - name: Upload Oobee Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: oobee-desktop-windows
          path: |
            oobee-desktop-windows.zip
            oobee-desktop-windows.zip.sha256.txt
        
      - name: Release Windows artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            oobee-desktop-windows.zip
            oobee-desktop-windows.zip.sha256.txt
            
  mac-install-purple:
    needs: [build-llama-vulkan-x64, build-embedding-model, build-wcag-index, build-frameworks-index]
    # Run even if the shared builds failed — we fall back to ggml-org's
    # CPU-only binary and a local WCAG/DSS index rebuild in those cases.
    if: always()
    runs-on: macos-latest
    env:
      # Developer ID Application
      CER_B64:        ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_CERT_CER }}
      P12_B64:        ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_PRIVATEKEY_P12 }}
      P12_PASSWORD:   ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_PRIVATEKEY_P12_PASSWORD }}
      # Distribution (for installer/notarization)
      DIST_CER_B64:   ${{ secrets.ORG_DISTRIBUTION_CERT_CER }}
      DIST_P12_B64:   ${{ secrets.ORG_DISTRIBUTION_PRIVATEKEY_P12 }}
      DIST_P12_PASS:  ${{ secrets.ORG_DISTRIBUTION_PRIVATEKEY_P12_PASSWORD }}
    environment: macos
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Install Rosetta 2 (if needed)
        run: |
          # This command is no-op on Intel, and installs on Apple Silicon
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Clean Workspace Folder
        run: |
         rm -rf ./* || true
         rm -rf ./.??* || true

      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          path: ${{github.workspace}}

      - name: Download node.js version from nodejs.org
        run: |
          curl -o ./nodejs-mac-arm64.tar.gz --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-darwin-arm64.tar.gz
          mkdir nodejs-mac-arm64 && tar -xzf nodejs-mac-arm64.tar.gz -C nodejs-mac-arm64 --strip-components=1 && rm ./nodejs-mac-arm64.tar.gz
          curl -o ./nodejs-mac-x64.tar.gz --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-darwin-x64.tar.gz
          mkdir nodejs-mac-x64 && tar -xzf nodejs-mac-x64.tar.gz -C nodejs-mac-x64 --strip-components=1 && rm ./nodejs-mac-x64.tar.gz
        working-directory: ${{github.workspace}}

      - name: Read pinned llama.cpp tag
        id: pin
        run: |
          TAG=$(node -e "console.log(require('./resources/llama-binaries.json').tag)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Restore the darwin-x64 llama-server that build-llama-vulkan-x64
      # cached. If restore misses (build failed, or first run before the
      # build job populated the cache), fetch-llama-binaries.js will see an
      # empty directory and download ggml-org's CPU-only binary as fallback.
      - name: Restore prebuilt Vulkan llama-server (darwin-x64)
        uses: actions/cache/restore@v4
        with:
          path: resources/darwin-x64/llama-server
          key: llama-server-darwin-x64-${{ steps.pin.outputs.tag }}-vulkan-v1-${{ hashFiles('scripts/build-llama-vulkan-x64.sh') }}

      # Pull the WCAG + DSS index from the workflow-scoped artifact that
      # build-wcag-index uploaded. Uses download-artifact (cross-OS) rather
      # than cache-restore (OS-scoped) so the same source of truth serves
      # both windows and mac jobs. On failure (upstream job failed or
      # artifact missing) continue anyway — ensure-wcag-index.js will
      # rebuild locally during npm run make-mac.
      - name: Download WCAG + DSS index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wcag-dss-index
          path: ${{github.workspace}}

      # Same story for the framework/language docs index — restore from the
      # build-frameworks-index artifact so make-mac doesn't re-clone
      # oobee-ai-rag-index + re-chunk locally. Fallback: ensure-frameworks-
      # index.js re-runs during make-mac.
      - name: Download frameworks/languages docs index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frameworks-docs-index
          path: ${{github.workspace}}

      # Restore the bundled MiniLM embedding model. Needed at runtime for
      # the hybrid search vector leg AND at build time as a fallback when
      # the WCAG/frameworks index artifacts miss (ensure-embedding-model.js
      # would otherwise fetch it from Hugging Face during make-mac).
      - name: Download embedding-model artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: embedding-model
          path: ${{github.workspace}}/public/electron/embedding-model

      - name: Set environment variables for Node
        run: |
          if [[ $(uname -m) == 'arm64' ]]; then
            export PATH_TO_NODE="${{github.workspace}}/nodejs-mac-arm64/bin"
          else
            export PATH_TO_NODE="${{github.workspace}}/nodejs-mac-x64/bin"
          fi
          export PATH="$PATH_TO_NODE:$PATH"
          export PATH="$PWD/oobee-desktop/node_modules/.bin:$PATH"
        env:
          CI: "false"
        working-directory: ${{github.workspace}}

      - name: Decode & import certs into temporary keychain
        run: |
          # --- prepare tmp dir ---
          mkdir -p /tmp/signing

          # --- decode into /tmp ---
          echo "$CER_B64"   | openssl base64 -d -A > /tmp/signing/developer_id_application.cer
          echo "$P12_B64"   | openssl base64 -d -A > /tmp/signing/developer_id_application.p12
          echo "$DIST_CER_B64" | openssl base64 -d -A > /tmp/signing/distribution_installer.cer
          echo "$DIST_P12_B64" | openssl base64 -d -A > /tmp/signing/distribution_installer.p12

          # --- create & unlock keychain ---
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          # --- import Developer ID Application cert + key ---
          security import /tmp/signing/developer_id_application.cer \
            -k build.keychain -T /usr/bin/codesign
          security import /tmp/signing/developer_id_application.p12 \
            -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign

          # --- import Distribution (Installer) cert + key ---
          security import /tmp/signing/distribution_installer.cer \
            -k build.keychain -T /usr/bin/codesign
          security import /tmp/signing/distribution_installer.p12 \
            -k build.keychain -P "$DIST_P12_PASS" -T /usr/bin/codesign

          # 1) Unlock it again (just to be safe)
          security unlock-keychain -p "" build.keychain

          # 2) Allow codesign (and productbuild/pkgbuild) to use the keys without prompting
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

          # --- clean up all temp files ---
          rm -rf /tmp/signing

      # - name: Locate signing identity
      #   id: find_identity
      #   run: |
      #     # grabs the Developer ID Application name; you can also grep the Installer if needed
      #     ID=$(security find-identity -v -p codesigning build.keychain \
      #          | grep "Developer ID Application:" \
      #          | sed -E 's/^[[:space:]]*[0-9]+\) ([^"]+).*$/\1/')
      #     echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Install Node Modules and Build for Mac0S
        run: |
          npm install
          npm run make-mac
        env:
          CI: "false"
          BE_TAG: "${{ vars.BE_TAG }}"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PRE_RELEASE: ${{ inputs.pre_release && '1' || '' }}
        working-directory: ${{github.workspace}}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain
        
      - name: Move and rename universal binary zip (Mac)
        run: |
          mv *.zip "${{github.workspace}}/oobee-desktop-macos.zip"
        working-directory: ${{github.workspace}}/out/make/zip/darwin/universal
        
      - name: Compute SHA256 hash for Mac
        run: |
          hash=$(shasum -a 256 oobee-desktop-macos.zip | awk '{ print $1 }')
          printf "%s" "$hash" > oobee-desktop-macos.zip.sha256.txt
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: oobee-desktop-macos
          path: |
            oobee-desktop-macos.zip
            oobee-desktop-macos.zip.sha256.txt
          
      - name: Release Mac artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            oobee-desktop-macos.zip
            oobee-desktop-macos.zip.sha256.txt
