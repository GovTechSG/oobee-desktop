name: Build MacOS and Windows image

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Pre-release app (grey icon)'
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  # Cross-compile llama.cpp with Metal enabled for darwin-x64. ggml-org's
  # official darwin-x64 release ships without any GPU backend (CPU libs only),
  # so Intel Mac users get no acceleration from the pinned binary. Building
  # here fills that gap. Runs first so the mac job can restore the resulting
  # binary from cache; on failure this job is best-effort — continue-on-error
  # lets the mac job proceed and fall back to the ggml-org CPU-only binary via
  # fetch-llama-binaries.js.
  build-llama-metal-x64:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Read pinned llama.cpp tag
        id: pin
        run: |
          TAG=$(node -e "console.log(require('./resources/llama-binaries.json').tag)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Cache llama.cpp Metal build (darwin-x64)
        id: cache
        uses: actions/cache@v4
        with:
          path: resources/darwin-x64/llama-server
          key: llama-server-darwin-x64-${{ steps.pin.outputs.tag }}-metal-v3

      - name: Build llama.cpp with Metal for darwin-x64
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.pin.outputs.tag }}"
          echo "Cloning llama.cpp @ $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp

          # Cross-compile from arm64 runner to x86_64. Metal shaders are GPU-
          # architecture, not CPU-architecture, so EMBED_LIBRARY works either
          # way. Deployment target 11.0 matches ggml-org's official builds.
          #
          # LLAMA_SERVER_SSL=OFF + CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE:
          # cpp-httplib auto-enables its TLS code path whenever cmake finds
          # OpenSSL. GHA runners have Homebrew's arm64 OpenSSL on the search
          # path, which then fails to link into an x86_64 binary. Forcing
          # OpenSSL to be "not found" keeps cpp-httplib in plaintext-only mode
          # (fine — the server binds to 127.0.0.1 anyway).
          # CMAKE_BUILD_WITH_INSTALL_RPATH + CMAKE_INSTALL_RPATH=@loader_path:
          # cmake defaults to baking the build tree (/tmp/llama.cpp/build/bin)
          # as an LC_RPATH entry so binaries can find their dylibs during
          # development. On end-user Macs that /tmp/ dir doesn't exist and
          # llama-server aborts on load. Match ggml-org's official arm64
          # binary, which ships with a single @loader_path rpath — that
          # resolves via the dylib's own directory, which after packaging
          # is <app>/Contents/Resources/llama-server/.
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_SERVER_SSL=OFF \
            -DBUILD_SHARED_LIBS=ON
          # macos-latest arm64 runners are 3-core; use hw.ncpu to size -j
          # exactly to the host so we don't oversubscribe (cpp-httplib alone
          # eats ~4 GB while compiling and the runner has 7 GB total).
          NPROC=$(sysctl -n hw.ncpu)
          echo "Building with -j $NPROC"
          cmake --build /tmp/llama.cpp/build -j "$NPROC" --target llama-server

          # Verify the binary is actually x86_64 before caching.
          file /tmp/llama.cpp/build/bin/llama-server
          file /tmp/llama.cpp/build/bin/llama-server | grep -q x86_64

          mkdir -p resources/darwin-x64/llama-server
          cp /tmp/llama.cpp/build/bin/llama-server resources/darwin-x64/llama-server/
          # -P preserves symlinks. cmake's SOVERSION emits three names per
          # library (libFoo.dylib -> libFoo.0.dylib -> libFoo.0.20.2.dylib);
          # ggml-org's tarball ships them as 1 real file + 2 symlinks, and
          # @electron/universal counts Mach-O files across the two arch
          # slices — if x64 has 3 real files while arm64 has 1 + 2 symlinks,
          # the counts diverge and the universal merge aborts.
          cp -P /tmp/llama.cpp/build/bin/*.dylib resources/darwin-x64/llama-server/

          # Belt-and-suspenders rpath cleanup: llama.cpp's per-target
          # CMakeLists occasionally set INSTALL_RPATH themselves, overriding
          # the top-level CMAKE_INSTALL_RPATH we passed above. Walk every
          # real Mach-O file in the shipped tree, strip any stray build-tree
          # rpath, ensure @loader_path is present, and ad-hoc re-sign
          # (install_name_tool invalidates whatever signature cmake baked in;
          # Electron's osxSign will replace this with the Developer ID
          # Application signature during packaging).
          for f in resources/darwin-x64/llama-server/llama-server \
                   resources/darwin-x64/llama-server/*.dylib; do
            [ -L "$f" ] && continue  # skip SOVERSION symlinks
            install_name_tool -delete_rpath /tmp/llama.cpp/build/bin "$f" 2>/dev/null || true
            install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true
            codesign --sign - --force "$f" 2>/dev/null || true
          done
          echo "[verify] llama-server rpath entries:"
          otool -l resources/darwin-x64/llama-server/llama-server | grep -A 2 LC_RPATH || true

          # Stamp with the manifest tag so fetch-llama-binaries.js sees a match
          # on subsequent prepackage runs and skips the ggml-org download.
          echo "$TAG" > resources/darwin-x64/llama-server/.tag

          ls -la resources/darwin-x64/llama-server/

  # Build the WCAG + DSS search index once, cache it, and let both platform
  # jobs restore it. Embedding ~1,300 chunks with all-MiniLM-L6-v2 takes
  # 2–5 minutes plus the DSS scrape + WCAG clone; skipping it saves that
  # time on both windows-install-purple and mac-install-purple. The output
  # is platform-agnostic bytes, so a cheap ubuntu runner is fine.
  build-wcag-index:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache WCAG source, DSS scrape, and built index
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/wcag-src
            .cache/oobee-DETAILS.md
            .cache/dss
            public/electron/wcag-index
          # Bust the cache when any of the scrape/embed scripts change; the
          # WCAG tag is pinned inside ensure-wcag-index.js so its hash covers
          # tag bumps too. DETAILS.md is fetched from oobee master and is not
          # pinned — bump the -v1 suffix manually to force a rebuild when
          # upstream DETAILS.md changes materially.
          key: wcag-index-${{ hashFiles('scripts/ensure-wcag-index.js', 'scripts/build-wcag-index.js', 'scripts/build-dss-corpus.js') }}-v1

      - name: Install dependencies (only needed to build the index)
        if: steps.cache.outputs.cache-hit != 'true'
        # `npm install` (not `npm ci`) to match the platform jobs — the repo's
        # package-lock.json drifts from package.json occasionally, and `npm ci`
        # would fail-hard on that. --ignore-scripts skips the react-scripts
        # postinstall which we don't need for the scrape/embed step.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Scrape WCAG + DSS and build embedding index
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/ensure-wcag-index.js

      - name: Show index size
        run: |
          if [ -d public/electron/wcag-index ]; then
            du -sh public/electron/wcag-index .cache 2>/dev/null || true
          fi

      # actions/cache is OS-scoped in practice (Linux + macOS use zstd, the
      # Windows runner falls back to gzip → different physical entry under the
      # same key), so windows-install-purple never hits this job's cache.
      # Re-publish the same paths as a workflow-run artifact so both platform
      # jobs can pick them up via download-artifact, which IS cross-OS.
      # include-hidden-files: true is required because the top-level path
      # begins with `.cache/`.
      - name: Upload WCAG + DSS index as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-dss-index
          path: |
            .cache/wcag-src
            .cache/oobee-DETAILS.md
            .cache/dss
            public/electron/wcag-index
          include-hidden-files: true
          retention-days: 1

  windows-install-purple:
    needs: build-wcag-index
    # Fall back to scraping/embedding locally if the shared build failed.
    if: always()
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      # Pull the WCAG + DSS index from the workflow-scoped artifact that
      # build-wcag-index uploaded. actions/cache is OS-scoped on windows, so
      # download-artifact is the cross-OS replacement. On failure (upstream
      # job failed or artifact missing) continue anyway — ensure-wcag-index.js
      # will rebuild locally during npm run make-win.
      - name: Download WCAG + DSS index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wcag-dss-index
          path: .

      - name: Enable Long File Path in Registry
        shell: pwsh
        run: |
          Start-Process powershell -Verb runAs -ArgumentList 'New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -PropertyType "DWORD" -Value "1"'
      
      - name: Download node.js version from nodejs.org
        run: |
          curl -o ./nodejs-win.zip --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-win-x64.zip
          mkdir nodejs-win && tar -xzf nodejs-win.zip -C nodejs-win --strip-components=1 && rm ./nodejs-win.zip
        working-directory: ${{github.workspace}}

      - name: Download and Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile "${{github.workspace}}\is.exe" 
          Start-Process -FilePath "${{github.workspace}}\is.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
          echo "${env:programfiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Install Node Modules and Build for Windows
        run: |
          $env:Path = "${{github.workspace}}\nodejs-win;${{github.workspace}}\oobee-desktop\node_modules\.bin;$env:Path;";
          npm install
          npm run make-win
        env:
          CI: "false"
          PRE_RELEASE: ${{ inputs.pre_release && '1' || '' }}
        working-directory: ${{github.workspace}}

      - name: Move build to root
        shell: pwsh
        run: |
          Move-Item  "${{github.workspace}}\out\Oobee-win32-x64" -Destination "${{github.workspace}}\Oobee-win32-x64" -Force
      
      - name: Download Oobee Backend
        shell: pwsh
        run: |
          $PHbackendUrl = "https://github.com/GovTechSG/oobee/releases/download/${{ vars.BE_TAG }}/oobee-portable-windows.zip"
          $BEdestinationPath = "${{github.workspace}}\PHLatest.zip"
          $BEextractPath = "D:\a\Oobee Backend"
          Invoke-WebRequest -Uri $PHbackendUrl -OutFile $BEdestinationPath
          Expand-Archive -Path $BEdestinationPath -DestinationPath $BEextractPath -Force
          Remove-Item -Path $BEdestinationPath

      - name: Execute Inno Setup script to compile installer
        shell: pwsh
        run: ISCC /O"${{github.workspace}}" "${{github.workspace}}\a11y_for_windows.iss"

      - name: Move compiled installer to Workspace
        run: |
          New-Item -Path setup -ItemType Directory
          Move-Item -Path mysetup.exe -Destination setup\Oobee-setup.exe
        working-directory: ${{github.workspace}}

      - name: Zip Setup file (Windows)
        shell: pwsh
        run: Compress-Archive -Path ${{github.workspace}}/setup/* -DestinationPath oobee-desktop-windows.zip
        working-directory: ${{github.workspace}}
        
      - name: Compute SHA256 hash for Windows
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 oobee-desktop-windows.zip).Hash
          [System.IO.File]::WriteAllText("oobee-desktop-windows.zip.sha256.txt", $hash)
      
      - name: Upload Oobee Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: oobee-desktop-windows
          path: |
            oobee-desktop-windows.zip
            oobee-desktop-windows.zip.sha256.txt
        
      - name: Release Windows artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            oobee-desktop-windows.zip
            oobee-desktop-windows.zip.sha256.txt
            
  mac-install-purple:
    needs: [build-llama-metal-x64, build-wcag-index]
    # Run even if the shared builds failed — we fall back to ggml-org's
    # CPU-only binary and a local WCAG/DSS index rebuild in those cases.
    if: always()
    runs-on: macos-latest
    env:
      # Developer ID Application
      CER_B64:        ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_CERT_CER }}
      P12_B64:        ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_PRIVATEKEY_P12 }}
      P12_PASSWORD:   ${{ secrets.ORG_DEVELOPER_ID_APPLICATION_PRIVATEKEY_P12_PASSWORD }}
      # Distribution (for installer/notarization)
      DIST_CER_B64:   ${{ secrets.ORG_DISTRIBUTION_CERT_CER }}
      DIST_P12_B64:   ${{ secrets.ORG_DISTRIBUTION_PRIVATEKEY_P12 }}
      DIST_P12_PASS:  ${{ secrets.ORG_DISTRIBUTION_PRIVATEKEY_P12_PASSWORD }}
    environment: macos
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Install Rosetta 2 (if needed)
        run: |
          # This command is no-op on Intel, and installs on Apple Silicon
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Clean Workspace Folder
        run: |
         rm -rf ./* || true
         rm -rf ./.??* || true

      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          path: ${{github.workspace}}

      - name: Download node.js version from nodejs.org
        run: |
          curl -o ./nodejs-mac-arm64.tar.gz --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-darwin-arm64.tar.gz
          mkdir nodejs-mac-arm64 && tar -xzf nodejs-mac-arm64.tar.gz -C nodejs-mac-arm64 --strip-components=1 && rm ./nodejs-mac-arm64.tar.gz
          curl -o ./nodejs-mac-x64.tar.gz --create-dirs https://nodejs.org/dist/v22.19.0/node-v22.19.0-darwin-x64.tar.gz
          mkdir nodejs-mac-x64 && tar -xzf nodejs-mac-x64.tar.gz -C nodejs-mac-x64 --strip-components=1 && rm ./nodejs-mac-x64.tar.gz
        working-directory: ${{github.workspace}}

      - name: Read pinned llama.cpp tag
        id: pin
        run: |
          TAG=$(node -e "console.log(require('./resources/llama-binaries.json').tag)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Restore the darwin-x64 llama-server that build-llama-metal-x64 cached.
      # If restore misses (build failed, or first run before the build job
      # populated the cache), fetch-llama-binaries.js will see an empty
      # directory and download ggml-org's CPU-only binary as fallback.
      - name: Restore prebuilt Metal llama-server (darwin-x64)
        uses: actions/cache/restore@v4
        with:
          path: resources/darwin-x64/llama-server
          key: llama-server-darwin-x64-${{ steps.pin.outputs.tag }}-metal-v3

      # Pull the WCAG + DSS index from the workflow-scoped artifact that
      # build-wcag-index uploaded. Uses download-artifact (cross-OS) rather
      # than cache-restore (OS-scoped) so the same source of truth serves
      # both windows and mac jobs. On failure (upstream job failed or
      # artifact missing) continue anyway — ensure-wcag-index.js will
      # rebuild locally during npm run make-mac.
      - name: Download WCAG + DSS index artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wcag-dss-index
          path: ${{github.workspace}}

      - name: Set environment variables for Node
        run: |
          if [[ $(uname -m) == 'arm64' ]]; then
            export PATH_TO_NODE="${{github.workspace}}/nodejs-mac-arm64/bin"
          else
            export PATH_TO_NODE="${{github.workspace}}/nodejs-mac-x64/bin"
          fi
          export PATH="$PATH_TO_NODE:$PATH"
          export PATH="$PWD/oobee-desktop/node_modules/.bin:$PATH"
        env:
          CI: "false"
        working-directory: ${{github.workspace}}

      - name: Decode & import certs into temporary keychain
        run: |
          # --- prepare tmp dir ---
          mkdir -p /tmp/signing

          # --- decode into /tmp ---
          echo "$CER_B64"   | openssl base64 -d -A > /tmp/signing/developer_id_application.cer
          echo "$P12_B64"   | openssl base64 -d -A > /tmp/signing/developer_id_application.p12
          echo "$DIST_CER_B64" | openssl base64 -d -A > /tmp/signing/distribution_installer.cer
          echo "$DIST_P12_B64" | openssl base64 -d -A > /tmp/signing/distribution_installer.p12

          # --- create & unlock keychain ---
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          # --- import Developer ID Application cert + key ---
          security import /tmp/signing/developer_id_application.cer \
            -k build.keychain -T /usr/bin/codesign
          security import /tmp/signing/developer_id_application.p12 \
            -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign

          # --- import Distribution (Installer) cert + key ---
          security import /tmp/signing/distribution_installer.cer \
            -k build.keychain -T /usr/bin/codesign
          security import /tmp/signing/distribution_installer.p12 \
            -k build.keychain -P "$DIST_P12_PASS" -T /usr/bin/codesign

          # 1) Unlock it again (just to be safe)
          security unlock-keychain -p "" build.keychain

          # 2) Allow codesign (and productbuild/pkgbuild) to use the keys without prompting
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

          # --- clean up all temp files ---
          rm -rf /tmp/signing

      # - name: Locate signing identity
      #   id: find_identity
      #   run: |
      #     # grabs the Developer ID Application name; you can also grep the Installer if needed
      #     ID=$(security find-identity -v -p codesigning build.keychain \
      #          | grep "Developer ID Application:" \
      #          | sed -E 's/^[[:space:]]*[0-9]+\) ([^"]+).*$/\1/')
      #     echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Install Node Modules and Build for Mac0S
        run: |
          npm install
          npm run make-mac
        env:
          CI: "false"
          BE_TAG: "${{ vars.BE_TAG }}"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PRE_RELEASE: ${{ inputs.pre_release && '1' || '' }}
        working-directory: ${{github.workspace}}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain
        
      - name: Move and rename universal binary zip (Mac)
        run: |
          mv *.zip "${{github.workspace}}/oobee-desktop-macos.zip"
        working-directory: ${{github.workspace}}/out/make/zip/darwin/universal
        
      - name: Compute SHA256 hash for Mac
        run: |
          hash=$(shasum -a 256 oobee-desktop-macos.zip | awk '{ print $1 }')
          printf "%s" "$hash" > oobee-desktop-macos.zip.sha256.txt
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: oobee-desktop-macos
          path: |
            oobee-desktop-macos.zip
            oobee-desktop-macos.zip.sha256.txt
          
      - name: Release Mac artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            oobee-desktop-macos.zip
            oobee-desktop-macos.zip.sha256.txt
